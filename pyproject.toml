[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenml-mlops"
version = "0.1.0"
description = "Unified MLOps orchestration platform — Matrix Factorization pipeline for movie recommendations"
requires-python = ">=3.13"
dependencies = [
    # ZenML core + integrations
    "zenml[server]==0.96.2", # Note: Docker image is based on this version, so keep it in sync with the Dockerfile
    # ZenML integrations (installed separately via `zenml integration install`)
    # aws, s3, sagemaker — see Makefile setup target
    "s3fs>=2026.6.0",
    # ML algorithm
    "implicit>=0.7.3",
    "numpy==2.4.6", # Numba compatibility pin
    # Numba JIT compilation
    "numba~=0.66.0",
    # Hyperparameter optimization
    "optuna>=4.9.0",
    "optuna-integration>=4.9.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    # Monitoring / drift detection
    "evidently>=0.7.21",
    # Serving
    "fastapi>=0.120.4",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.12.5",
    # AWS
    "boto3>=1.43.0",
    "botocore>=1.43.0",
    # Utilities
    "cloudpickle>=3.1.2",
    "tqdm>=4.68.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "pyomp>=0.2.0",
    "plotly>=5.24.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[project.scripts]
aips-recs = "run:main"

[tool.hatch.build.targets.wheel]
packages = ["workflows"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]                          # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests", "workflows"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
