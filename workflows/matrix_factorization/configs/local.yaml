# ZenML pipeline run configuration — LOCAL development
# Used with: python run.py --config configs/local.yaml --stack local_stack
#
# This config targets MovieLens 1M dataset with small Dask partitions and
# SQLite-backed Optuna storage. Everything runs in-process on your machine.

# ── Pipeline-level infrastructure settings ────────────────────────────────────
enable_cache: true
enable_step_logs: true
enable_pipeline_logs: true
execution_mode: "stop_on_failure"
enable_artifact_metadata: True # Whether to collect and store metadata for artifacts
enable_artifact_visualization: True # Whether to generate visualizations for artifacts
settings:
  docker:
    dockerfile: "docker/pipeline/Dockerfile"

parameters:
  # Pipeline-level defaults (not step parameters)
  service_name: ${SERVICE:-zenml-mlops}
  workflow_name: "matrix_factorization"

  rank: 50
  regularization: 0.01
  alpha: 1.0
  n_iter: 15
  enable_hpo: false

  n_dask_partitions: 64

  retrain_pipeline_module: "workflows/matrix_factorization/pipelines/retrain_pipeline.py"
  retrain_pipeline_function: "retrain_pipeline"
  retrain_config_path: "workflows/matrix_factorization/configs/local.yaml"

# ── Step-level cache settings ─────────────────────────────────────────────────
steps:
  ingest_data:
    enable_cache: true
    parameters:
      # Dataset scale: "1m" (local dev) or "25m" (AWS production)
      dataset_size: "1m"

  validate_data:
    enable_cache: true
    parameters:
      # Data validation thresholds
      min_sparsity: 0.95
      min_ratings: 100000

  build_encoders:
    enable_cache: true
  split_data:
    enable_cache: true
    parameters:
      # Train / val / test split ratios (must sum to 1.0)
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1

  run_hpo:
    enable_cache: false
    parameters:
      hpo_n_trials: 20
      hpo_subsample_fraction: 0.2
      # MySQL ops-db Optuna storage — connects to the local ops-db container
      optuna_storage: "${OPS_DB_URI}/${OPTUNA_DB_NAME:-optuna}"
      optuna_study_name: "als_movielens_local"

  train_als:
    enable_cache: true
    parameters:
      # Checkpoint dir — relative path for local, s3:// URI for AWS
      checkpoint_path: "./checkpoints"
      # Validate every N epochs (set 0 to disable intra-step validation logging)
      checkpoint_val_every_n_epochs: 5

  compute_metrics:
    enable_cache: true
    parameters:
      top_k: 10

  register_model:
    enable_cache: false
    parameters:
      # Model quality gate: promote to staging only if RMSE < this threshold
      rmse_threshold: 1.0
      checkpoint_path: "./checkpoints"

  generate_batch_recommendations:
    enable_cache: false
    parameters:
      batch_top_k: 50
      batch_output_path: "./predictions/batch"
      model_stage: "staging"
      user_batch_size: 10000
      n_parallel_batches: 2
      checkpoint_path: "./checkpoints"
      dynamodb_table: "${ZENML_BATCH_DDB_TABLE_NAME:-}"
      dynamodb_partition_key: "${ZENML_BATCH_DDB_PARTITION_KEY_NAME:-userId}"

  build_serving_image:
    enable_cache: false
    parameters:
      ecr_uri: ""
      model_stage: "staging"
      service_name: ${SERVICE:-zenml-mlops}
      workflow_name: "matrix_factorization"

  deploy_endpoint:
    enable_cache: false
    parameters:
      endpoint_name: "als-movie-recommender"
      instance_type: "ml.t2.medium"
      deploy_mode: "local"
      local_port: 8080

  collect_inference_logs:
    enable_cache: false
    parameters:
      logs_path: "./logs/inference"
      lookback_days: 7

  run_drift_detection:
    enable_cache: false
    parameters:
      reference_id_column: "userId"
      current_id_column: "user_id"
      numerical_columns: ["userId"]
      monitoring_output_path: "./predictions/monitoring"

  check_retrain_trigger:
    enable_cache: false
    parameters:
      drift_threshold_n_features: 2
      max_age_days: 30

  trigger_retraining:
    enable_cache: false
