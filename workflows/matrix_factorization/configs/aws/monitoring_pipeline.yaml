# ZenML pipeline run configuration — AWS production (monitoring_pipeline)
# Runs Data Drift & Data Quality checks:
#   reference  = new data from ingest_data (future: recent ratings)
#   comparison = training baseline from load_raw_ratings_artifact

enable_cache: false
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-monitoring-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  ingest_data:
    runtime: inline
    enable_cache: false
    parameters:
      dataset_size: "25m"
      lookback_days: 30

  check_retrain_trigger:
    runtime: inline
    enable_cache: false
    parameters:
      model_stage: "production"
      drifted_column_share_threshold: 0.5
      missing_values_share_threshold: 0.1
      max_age_days: 30

