# ZenML pipeline run configuration — AWS production (monitoring_pipeline)

enable_cache: false
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-monitoring-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  ingest_data:
    enable_cache: true
    step_operator: true
    parameters:
      dataset_size: "25m"

  collect_inference_logs:
    enable_cache: false
    parameters:
      logs_path: "s3://${ZENML_PREDICTIONS_BUCKET}/logs"
      lookback_days: 7

  run_drift_detection:
    enable_cache: false
    step_operator: true
    parameters:
      reference_id_column: "userId"
      current_id_column: "user_id"
      monitoring_output_path: "s3://${ZENML_PREDICTIONS_BUCKET}/monitoring"

  check_retrain_trigger:
    enable_cache: false
    parameters:
      drift_threshold_n_features: 2
      max_age_days: 30

  trigger_retraining:
    enable_cache: false
    parameters:
      pipeline_name: "matrix_factorization_training"
      config_path: "workflows/matrix_factorization/configs/aws/training_pipeline.yaml"
