# ZenML pipeline run configuration - AWS production (data_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-data-pipeline"
    dockerfile: "docker/pipeline/Dockerfile.pyspark"
    build_context_root: "."
    disable_automatic_requirements_detection: true
    environment:
      SERVICE: aws-mf-data-pipeline
      ENVIRONMENT: ${ENVIRONMENT:-aws}
      BUILD_VERSION: "${BUILD_VERSION}"

steps:
  ingest_data:
    runtime: isolated
    enable_cache: true
    step_operator: true
    parameters:
      dataset_table: "ml_ratings_25m"
      spark_master_url: "${SPARK_MASTER_URL}"
      lookback_days: 3650 # 10 years relative to dataset's age - old dataset
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4GB"

  validate_data:
    runtime: inline
    enable_cache: true
    parameters:
      min_sparsity: 0.95
      min_ratings: 1000000 # 1 million minimum ratings

  preprocess_data:
    runtime: inline
    enable_cache: true
    parameters:
      min_user_ratings: 5
      min_item_ratings: 5
      top_ratings_per_user: 20
      power_scaling_alpha: 0.5

  build_encoders:
    runtime: inline
    enable_cache: true

  split_data:
    runtime: inline
    enable_cache: true
    step_operator: true
    parameters:
      train_ratio: 0.9
      val_ratio: 0.1

  create_features_artifact:
    runtime: inline
    enable_cache: true
