# ZenML pipeline run configuration - AWS production (data_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-data-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  ingest_data:
    runtime: isolated
    enable_cache: true
    step_operator: true
    parameters:
      dataset_size: "25m"
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4GB"

  validate_data:
    runtime: inline
    enable_cache: true
    parameters:
      min_sparsity: 0.95
      min_ratings: 20000000

  build_encoders:
    runtime: inline
    enable_cache: true
    parameters:
      power_scaling_alpha: 0.5

  create_features_artifact:
    runtime: inline
    enable_cache: true
