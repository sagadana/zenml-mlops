# ZenML pipeline run configuration — AWS production (training_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-training-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true
    environment:
      SERVICE: aws-mf-training-pipeline
      ENVIRONMENT: ${ENVIRONMENT:-aws}
      BUILD_VERSION: "${BUILD_VERSION}"

parameters:
  model_stage: "production"
  factors: 11
  regularization: 0.03117378085772213
  alpha: 12.0
  n_iter: 5
  n_workers: 8
  k: 20
  eval_every_n_epochs: 1
  checkpoint_every_n_epochs: 1
  recommender_class_name: "workflows.matrix_factorization.models.als_implicit_recommender.ALSImplicitRecommender"
  enable_hpo: false
  hpo_n_trials: 20
  hpo_subsample_fraction: 0.3
  hpo_metric: "ndcg"
  checkpoint_path: "s3://${ZENML_CHECKPOINT_BUCKET}"
  seaweedfs_s3_internal_endpoint: "${SEAWEEDFS_S3_INTERNAL_ENDPOINT}"
  zenml_local_s3_secret_name: "${ZENML_LOCAL_S3_SECRET_NAME}"
  enable_warm_start: true
  warm_start_model_stage: "production"

steps:
  load_features_artifact:
    runtime: inline
    enable_cache: false

  run_hpo_trial:
    runtime: isolated
    step operator: true

  full_train_als:
    runtime: isolated
    enable_cache: true
    step_operator: true

  compute_new_model_metrics:
    runtime: inline
    enable_cache: true

  compute_previous_model_metrics:
    runtime: inline
    enable_cache: true

  quality_check:
    runtime: inline
    enable_cache: false
    parameters:
      precision_at_k_threshold: 0.01
      recall_at_k_threshold: 0.01
      ndcg_at_k_threshold: 0.01

  register_model:
    runtime: inline
    enable_cache: false
    parameters:
      force_promote: false
