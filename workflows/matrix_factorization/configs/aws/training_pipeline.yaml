# ZenML pipeline run configuration — AWS production (training_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-training-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

parameters:
  model_stage: "production"
  rank: 50
  regularization: 0.1
  alpha: 30.0
  n_iter: 200
  n_workers: 16
  k: 20
  eval_every_n_epochs: 1
  checkpoint_every_n_epochs: 1
  recommender_class_name: "workflows.matrix_factorization.models.als_implicit_recommender.ALSImplicitRecommender"
  enable_hpo: false
  hpo_n_trials: 200
  hpo_subsample_fraction: 0.2
  optuna_storage: "${OPTUNA_STORAGE_URI}"
  optuna_study_name: "als_movielens_aws"
  hpo_metric: "ndcg"
  checkpoint_path: "s3://${ZENML_CHECKPOINT_BUCKET}"
  seaweedfs_s3_internal_endpoint: "${SEAWEEDFS_S3_INTERNAL_ENDPOINT}"
  zenml_local_s3_secret_name: "${ZENML_LOCAL_S3_SECRET_NAME}"
  trigger_serving_on_complete: true

steps:
  load_features_artifact:
    runtime: inline
    enable_cache: false

  split_data:
    runtime: inline
    enable_cache: true
    step_operator: true
    parameters:
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1

  run_hpo_trial:
    runtime: isolated
    step operator: true

  train_als:
    runtime: isolated
    enable_cache: true
    step_operator: true

  compute_metrics:
    runtime: inline
    enable_cache: true

  register_model:
    runtime: inline
    enable_cache: false
    parameters:
      precision_at_k_threshold: 0.01
      recall_at_k_threshold: 0.01
      ndcg_at_k_threshold: 0.01

