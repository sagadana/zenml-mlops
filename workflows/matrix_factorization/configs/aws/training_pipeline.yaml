# ZenML pipeline run configuration — AWS production (training_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."

parameters:
  rank: 100
  regularization: 0.01
  alpha: 1.0
  n_iter: 20
  enable_hpo: true

steps:
  ingest_data:
    enable_cache: true
    step_operator: true
    parameters:
      dataset_size: "25m"
      n_dask_partitions: 64
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4GB"

  validate_data:
    enable_cache: true
    parameters:
      min_sparsity: 0.95
      min_ratings: 20000000

  build_encoders:
    enable_cache: true

  split_data:
    enable_cache: true
    step_operator: true
    parameters:
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1
      n_dask_partitions: 64

  run_hpo:
    enable_cache: false
    step_operator: true
    parameters:
      hpo_n_trials: 200
      hpo_subsample_fraction: 0.2
      optuna_storage: "${OPS_DB_URI}/${OPTUNA_DB_NAME:-optuna}"
      optuna_study_name: "als_movielens_aws"

  train_als:
    enable_cache: true
    step_operator: true
    parameters:
      n_dask_partitions: 64
      checkpoint_path: "s3://aips-recs-zenml-checkpoints"
      checkpoint_val_every_n_epochs: 5
    resources:
      cpu_count: 4
      gpu_count: 0
      memory: "16GB"

  compute_metrics:
    enable_cache: true
    parameters:
      top_k: 10

  register_model:
    enable_cache: false
    parameters:
      rmse_threshold: 1.0
      checkpoint_path: "s3://aips-recs-zenml-checkpoints"
