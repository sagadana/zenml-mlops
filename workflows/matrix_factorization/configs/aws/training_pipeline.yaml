# ZenML pipeline run configuration — AWS production (training_pipeline)

enable_cache: true
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-training-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

parameters:
  rank: 100
  regularization: 0.01
  alpha: 1.0
  n_iter: 20
  n_workers: 8
  checkpoint_val_every_n_epochs: 1
  enable_hpo: true
  hpo_n_trials: 200
  hpo_subsample_fraction: 0.2
  optuna_storage: "${OPTUNA_STORAGE_URI}"
  optuna_study_name: "als_movielens_aws"
  checkpoint_path: "s3://${ZENML_CHECKPOINT_BUCKET}"

steps:
  ingest_data:
    enable_cache: true
    step_operator: true
    parameters:
      dataset_size: "25m"
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4GB"

  validate_data:
    enable_cache: true
    parameters:
      min_sparsity: 0.95
      min_ratings: 20000000

  build_encoders:
    enable_cache: true

  split_data:
    enable_cache: true
    step_operator: true
    parameters:
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1

  compute_metrics:
    enable_cache: true
    parameters:
      top_k: 10

  register_model:
    enable_cache: false
    parameters:
      rmse_threshold: 1.0
