# ZenML pipeline run configuration — AWS production (online_evaluation_pipeline)

enable_cache: false
enable_step_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    image_tag: "aws-online-evaluation-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  ingest_logs:
    runtime: inline
    enable_cache: false
    parameters:
      model_stage: "production"
      logs_path: "s3://${ZENML_PREDICTIONS_BUCKET}/logs"
      lookback_days: 7
