# ZenML pipeline run configuration — AWS production
# Used with: python run.py --config configs/aws.yaml --stack aws_stack
#
# This config targets MovieLens 25M dataset with 64 Dask partitions running
# on SageMaker. Optuna uses PostgreSQL storage for distributed + persistent HPO.
# Checkpoints are written to S3.

# ── Pipeline-level infrastructure settings ────────────────────────────────────
enable_cache: true
enable_step_logs: true
enable_artifact_metadata: True # Whether to collect and store metadata for artifacts
enable_artifact_visualization: True # Whether to generate visualizations for artifacts

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1GB"
  docker:
    dockerfile: "docker/pipeline/Dockerfile"

parameters:
  # Pipeline-level defaults (not step parameters)
  service_name: ${SERVICE:-aips-recs-zenml-mlops}
  workflow_name: "matrix_factorization"
  ecr_uri: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

  rank: 100
  regularization: 0.01
  alpha: 1.0
  n_iter: 20
  enable_hpo: true

  n_dask_partitions: 64

  retrain_pipeline_module: "workflows/matrix_factorization/pipelines/retrain_pipeline.py"
  retrain_pipeline_function: "retrain_pipeline"
  retrain_config_path: "workflows/matrix_factorization/configs/aws.yaml"

# ── Step-level settings ───────────────────────────────────────────────────────
steps:
  ingest_data:
    enable_cache: true
    parameters:
      # Dataset scale: "1m" (local dev) or "25m" (AWS production)
      dataset_size: "25m"
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4GB"

  validate_data:
    enable_cache: true
    parameters:
      # Data validation thresholds
      min_sparsity: 0.95
      min_ratings: 20000000

  build_encoders:
    enable_cache: true

  split_data:
    enable_cache: true
    parameters:
      # Train / val / test split ratios (must sum to 1.0)
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1

  run_hpo:
    enable_cache: false
    parameters:
      hpo_n_trials: 200
      hpo_subsample_fraction: 0.2
      # MySQL ops-db Optuna storage — set full connection string via env var:
      optuna_storage: "${OPS_DB_URI}/${OPTUNA_DB_NAME:-optuna}"
      optuna_study_name: "als_movielens_aws"

  train_als:
    enable_cache: true
    parameters:
      # S3 checkpoint path — bucket must exist (created by infra/aws/setup_stacks.sh)
      checkpoint_path: "s3://aips-recs-zenml-checkpoints"
      checkpoint_val_every_n_epochs: 5
    resources:
      cpu_count: 4
      gpu_count: 0
      memory: "16GB"

  compute_metrics:
    enable_cache: true
    parameters:
      top_k: 10

  register_model:
    enable_cache: false
    parameters:
      rmse_threshold: 1.0
      checkpoint_path: "s3://aips-recs-zenml-checkpoints"

  generate_batch_recommendations:
    enable_cache: false
    parameters:
      batch_top_k: 50
      user_batch_size: 10000
      n_parallel_batches: 8
      checkpoint_path: "s3://aips-recs-zenml-checkpoints"
      model_stage: "production"
      # S3 path for batch recommendation output
      batch_output_path: "s3://${ZENML_PREDICTIONS_BUCKET}/batch"
      # DynamoDB table + partition key for real-time recommendations
      dynamodb_table: "${ZENML_BATCH_DDB_TABLE_NAME:-movie-recommendations}"
      dynamodb_partition_key: "${ZENML_BATCH_DDB_PARTITION_KEY_NAME:-id}"

  build_serving_image:
    enable_cache: false
    parameters:
      ecr_uri: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      model_stage: "production"
      service_name: ${SERVICE:-aips-recs-zenml-mlops}
      workflow_name: "matrix_factorization"

  deploy_endpoint:
    enable_cache: false
    parameters:
      endpoint_name: "als-movie-recommender"
      instance_type: "ml.t2.medium"
      deploy_mode: "sagemaker"
      local_port: 8080

  collect_inference_logs:
    enable_cache: false
    parameters:
      logs_path: "s3://aips-recs-zenml-predictions/logs"
      lookback_days: 7

  run_drift_detection:
    enable_cache: false
    parameters:
      reference_id_column: "userId"
      current_id_column: "user_id"
      numerical_columns: ["userId"]
      monitoring_output_path: "s3://aips-recs-zenml-predictions/monitoring"

  check_retrain_trigger:
    enable_cache: false
    parameters:
      drift_threshold_n_features: 2
      max_age_days: 30

  trigger_retraining:
    enable_cache: false
