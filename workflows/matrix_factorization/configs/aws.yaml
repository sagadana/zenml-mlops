# ZenML pipeline run configuration — AWS production
# Used with: python run.py --config configs/aws.yaml --stack aws_stack
#
# This config targets MovieLens 25M dataset with 64 Dask partitions running
# on SageMaker. Optuna uses PostgreSQL storage for distributed + persistent HPO.
# Checkpoints are written to S3.

# ── Pipeline-level infrastructure settings ────────────────────────────────────
enable_cache: true
enable_step_logs: true
enable_artifact_metadata: True # Whether to collect and store metadata for artifacts
enable_artifact_visualization: True # Whether to generate visualizations for artifacts

settings:
  resources:
    cpu_count: 1
    gpu_count: 0
    memory: "1Gb"
  docker:
    dockerfile: "workflows/matrix_factorization/Dockerfile"

parameters:
  # Pipeline-level defaults (not step parameters)
  rank: 100
  regularization: 0.01
  alpha: 1.0
  n_iter: 20
  enable_hpo: true
  realtime_default_top_k: 10

# ── Step-level settings ───────────────────────────────────────────────────────
steps:
  ingest_data:
    enable_cache: true
    parameters:
      # Dataset scale: "1m" (local dev) or "25m" (AWS production)
      dataset_size: "25m"
      # Dask partitioning — one task per partition per ALS epoch
      n_dask_partitions: 64
    resources:
      cpu_count: 2
      gpu_count: 0
      memory: "4Gb"
  validate_data:
    enable_cache: true
    parameters:
      # Data validation thresholds
      min_sparsity: 0.95
      min_ratings: 20000000
  build_encoders:
    enable_cache: true
  split_data:
    enable_cache: true
    parameters:
      # Train / val / test split ratios (must sum to 1.0)
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1
  run_hpo:
    enable_cache: false
    parameters:
      hpo_n_trials: 200
      hpo_subsample_fraction: 0.2
      # PostgreSQL connection string — set via environment variable at runtime:
      # export OPTUNA_STORAGE="******host:5432/optuna"
      optuna_storage: "${OPTUNA_STORAGE}"
      optuna_study_name: "als_movielens_aws"
  train_als:
    enable_cache: true
    parameters:
      # S3 checkpoint path — bucket must exist (created by infra/aws/setup_stacks.sh)
      checkpoint_path: "s3://aips-zenml-checkpoints"
      n_dask_partitions: 64
      checkpoint_val_every_n_epochs: 5
    resources:
      cpu_count: 4
      gpu_count: 1
      memory: "16Gb"
  compute_metrics:
    enable_cache: true
    parameters:
      top_k: 10
  register_model:
    enable_cache: false
    parameters:
      rmse_threshold: 1.0
      checkpoint_path: "s3://aips-zenml-checkpoints"
  generate_batch_recommendations:
    enable_cache: false
    parameters:
      batch_top_k: 50
      # S3 path for batch recommendation output
      batch_output_path: "s3://aips-zenml-predictions/batch"
      # DynamoDB table name for real-time recommendations
      dynamodb_table: "movie-recommendations"
  run_drift_detection:
    enable_cache: false
    parameters:
      monitoring_output_path: "s3://aips-zenml-predictions/monitoring"
  check_retrain_trigger:
    enable_cache: false
    parameters:
      drift_threshold_n_features: 2
      max_age_days: 30
