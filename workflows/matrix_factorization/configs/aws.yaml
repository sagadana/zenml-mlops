# ZenML pipeline run configuration — AWS production
# Used with: python run.py --config configs/aws.yaml --stack aws_stack
#
# This config targets MovieLens 25M dataset with 64 Dask partitions running
# on SageMaker. Optuna uses PostgreSQL storage for distributed + persistent HPO.
# Checkpoints are written to S3.

# ── Data ──────────────────────────────────────────────────────────────────────
parameters:
  # Dataset scale: "1m" (local dev) or "25m" (AWS production)
  dataset_size: "25m"

  # Data validation thresholds
  min_sparsity: 0.95
  min_ratings: 20000000

  # Dask partitioning — one task per partition per ALS epoch
  n_dask_partitions: 64

  # Train / val / test split ratios (must sum to 1.0)
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # ── ALS Hyperparameters (defaults; overridden by HPO output) ───────────────
  rank: 100
  regularization: 0.01
  alpha: 1.0
  n_iter: 20

  # ── HPO ───────────────────────────────────────────────────────────────────
  enable_hpo: true
  hpo_n_trials: 200
  hpo_subsample_fraction: 0.2
  # PostgreSQL connection string — set via environment variable at runtime:
  # export OPTUNA_STORAGE="postgresql://user:pass@host:5432/optuna"
  optuna_storage: "${OPTUNA_STORAGE}"
  optuna_study_name: "als_movielens_aws"

  # ── Training ──────────────────────────────────────────────────────────────
  # S3 checkpoint path — bucket must exist (created by infra/aws/setup_stacks.sh)
  checkpoint_path: "s3://aips-zenml-checkpoints"
  checkpoint_val_every_n_epochs: 5
  rmse_threshold: 1.0

  # ── Serving ───────────────────────────────────────────────────────────────
  batch_top_k: 50
  realtime_default_top_k: 10
  # S3 path for batch recommendation output
  batch_output_path: "s3://aips-zenml-predictions/batch"
  # DynamoDB table name for real-time recommendations
  dynamodb_table: "movie-recommendations"

  # ── Monitoring ────────────────────────────────────────────────────────────
  drift_threshold_n_features: 2
  max_age_days: 30
  monitoring_output_path: "s3://aips-zenml-predictions/monitoring"

# ── Step-level settings ───────────────────────────────────────────────────────
steps:
  ingest_data:
    enable_cache: true
  validate_data:
    enable_cache: true
  build_encoders:
    enable_cache: true
  split_data:
    enable_cache: true
  run_hpo:
    enable_cache: false
  train_als:
    enable_cache: true
    # Offload to dedicated SageMaker Training Job (ml.c5.4xlarge)
    step_operator: sagemaker_step_op
  compute_metrics:
    enable_cache: true
  register_model:
    enable_cache: false
  generate_batch_recommendations:
    enable_cache: false
