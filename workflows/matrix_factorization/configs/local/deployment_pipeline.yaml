# ZenML pipeline run configuration - LOCAL development (deployment_pipeline)

enable_cache: false
enable_step_logs: true
enable_pipeline_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    image_tag: "local-deployment-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  prepare_serving_uris:
    enable_cache: true
    parameters:
      image_registry_uri: "localhost:${LOCAL_REGISTRY_PORT:-5001}"
      model_stage: "staging"

  build_serving_image:
    runtime: isolated
    enable_cache: true
    parameters:
      service_name: ${SERVICE:-zenml-mlops}
      serving_dockerfile_path: "docker/serving/Dockerfile"

  deploy_endpoint:
    runtime: isolated
    enable_cache: false
    parameters:
      deploy_mode: "local"
      model_stage: "staging"
      endpoint_name: "als-movie-recommender"
      local_port: 8080
