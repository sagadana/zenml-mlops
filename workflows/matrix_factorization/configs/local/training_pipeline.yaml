# ZenML pipeline run configuration — LOCAL development (training_pipeline)

enable_step_logs: true
enable_pipeline_logs: true
execution_mode: "stop_on_failure"
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    image_tag: "local-training-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true
    environment:
      SERVICE: local-mf-training-pipeline-dev
      ENVIRONMENT: ${ENVIRONMENT}
      BUILD_VERSION: ${BUILD_VERSION}

parameters:
  model_stage: "staging"
  factors: 13
  regularization: 0.048
  alpha: 15.0
  n_iter: 57
  n_workers: 8
  k: 20
  eval_every_n_epochs: 1
  checkpoint_every_n_epochs: 1
  recommender_class_name: "workflows.matrix_factorization.models.als_implicit_recommender.ALSImplicitRecommender"
  # recommender_class_name: "workflows.matrix_factorization.models.als_numba_recommender.ALSNumbaRecommender"
  enable_hpo: false
  hpo_n_trials: 10
  hpo_subsample_fraction: 0.3
  hpo_metric: "ndcg"
  checkpoint_path: "s3://${ZENML_CHECKPOINT_BUCKET}"
  seaweedfs_s3_internal_endpoint: "${SEAWEEDFS_S3_INTERNAL_ENDPOINT}"
  zenml_local_s3_secret_name: "${ZENML_LOCAL_S3_SECRET_NAME}"
  enable_warm_start: false
  warm_start_model_stage: "staging"

steps:
  load_features_artifact:
    enable_cache: false

  suggest_hpo_trials:
    enable_cache: false

  run_hpo_trial:
    enable_cache: false

  train_als:
    enable_cache: false

  compute_metrics:
    enable_cache: false

  quality_check:
    enable_cache: false
    parameters:
      precision_at_k_threshold: 0.01
      recall_at_k_threshold: 0.01
      ndcg_at_k_threshold: 0.01

  register_model:
    enable_cache: false
    parameters:
      force_promote: true
