# ZenML pipeline run configuration — LOCAL development (serving_pipeline)

enable_cache: false
enable_step_logs: true
enable_pipeline_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."

parameters:
  n_batches: 1
  model_stage: "staging"
  batch_top_k: 50
  user_batch_size: 10000
  batch_output_path: "s3://${ZENML_PREDICTIONS_BUCKET}/batch"
  dynamodb_table: "${ZENML_BATCH_DDB_TABLE_NAME:-}"
  dynamodb_partition_key: "${ZENML_BATCH_DDB_PARTITION_KEY_NAME:-id}"

steps:
  build_serving_image:
    enable_cache: false
    parameters:
      model_name: "als_movie_recommender"
      model_artifact_name: "als_movie_model"
      ecr_uri: ""
      model_stage: "staging"
      service_name: ${SERVICE:-zenml-mlops}
      workflow_name: "matrix_factorization"
      serving_dockerfile_path: "docker/serving/Dockerfile"

  deploy_endpoint:
    enable_cache: false
    parameters:
      model_name: "als_movie_recommender"
      model_stage: "staging"
      endpoint_name: "als-movie-recommender"
      instance_type: "ml.t2.medium"
      deploy_mode: "local"
      local_port: 8080
