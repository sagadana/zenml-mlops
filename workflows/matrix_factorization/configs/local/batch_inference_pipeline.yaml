# ZenML pipeline run configuration - LOCAL development (batch_inference_pipeline)

enable_cache: false
enable_step_logs: true
enable_pipeline_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    image_tag: "local-batch-inference-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

parameters:
  n_batches: 3
  model_stage: "staging"
  batch_top_k: 50
  user_batch_size: 1000
  batch_output_path: "s3://${ZENML_PREDICTIONS_BUCKET}/batch"
  dynamodb_table: "${ZENML_BATCH_DDB_TABLE_NAME:-}"
  dynamodb_partition_key: "${ZENML_BATCH_DDB_PARTITION_KEY_NAME:-id}"

steps:
  load_als_model:
    runtime: inline
    enable_cache: false

  collect_batch_recommendations:
    runtime: inline
    enable_cache: false
