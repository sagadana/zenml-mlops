# ZenML pipeline run configuration — LOCAL development (monitoring_pipeline)

enable_cache: false
enable_step_logs: true
enable_pipeline_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    image_tag: "local-monitoring-pipeline"
    dockerfile: "docker/pipeline/Dockerfile"
    build_context_root: "."
    disable_automatic_requirements_detection: true

steps:
  ingest_data:
    runtime: isolated
    enable_cache: true
    parameters:
      dataset_size: "1m"

  ingest_logs:
    runtime: inline
    enable_cache: false
    parameters:
      logs_path: "s3://${ZENML_PREDICTIONS_BUCKET}/logs"
      lookback_days: 7
      seaweedfs_s3_internal_endpoint: "${SEAWEEDFS_S3_INTERNAL_ENDPOINT}"
      zenml_local_s3_secret_name: "${ZENML_LOCAL_S3_SECRET_NAME}"

  run_drift_detection:
    runtime: isolated
    enable_cache: false
    parameters:
      monitoring_output_path: "s3://${ZENML_PREDICTIONS_BUCKET}/monitoring"
      seaweedfs_s3_internal_endpoint: "${SEAWEEDFS_S3_INTERNAL_ENDPOINT}"
      zenml_local_s3_secret_name: "${ZENML_LOCAL_S3_SECRET_NAME}"

  check_retrain_trigger:
    runtime: inline
    enable_cache: false
    parameters:
      drifted_column_share_threshold: 0.5
      missing_values_share_threshold: 0.1
      max_age_days: 30

  trigger_retraining:
    runtime: inline
    enable_cache: false
    parameters:
      pipeline_name: "matrix_factorization_training"
      config_path: "workflows/matrix_factorization/configs/local/training_pipeline.yaml"
      server_url: "${ZENML_SERVER_URI}"
      service_account_name: "${ZENML_SERVICE_ACCOUNT_NAME}"
