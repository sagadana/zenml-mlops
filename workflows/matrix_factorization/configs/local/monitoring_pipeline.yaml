# ZenML pipeline run configuration — LOCAL development (monitoring_pipeline)
# Runs Data Drift & Data Quality checks:
#   reference  = new data from ingest_data (future: recent ratings)
#   comparison = training baseline from load_raw_ratings_artifact

enable_step_logs: true
enable_pipeline_logs: true
enable_artifact_metadata: true
enable_artifact_visualization: true

settings:
  docker:
    image_tag: "local-monitoring-pipeline"
    dockerfile: "docker/pipeline/Dockerfile.pyspark"
    build_context_root: "."
    disable_automatic_requirements_detection: true
    environment:
      SERVICE: local-mf-monitoring-pipeline
      ENVIRONMENT: "${ENVIRONMENT}"
      BUILD_VERSION: "${BUILD_VERSION}"

steps:
  load_raw_ratings_artifact:
    runtime: inline
    enable_cache: false
    parameters:
      sample_fraction: 0.2 # Example: randomly sample 20% of the data
      
  ingest_data:
    runtime: inline
    enable_cache: false
    parameters:
      dataset_table: "ml_ratings_1m"
      spark_master_url: "spark://spark-master:7077"
      lookback_days: 3650 # 10 years relative to dataset's age - old dataset
      sample_fraction: 0.2 # Example: randomly sample 20% of the data
  
  check_retrain:
    runtime: inline
    enable_cache: false
    parameters:
      model_stage: "staging"
      drifted_column_share_threshold: 0.5
      missing_values_share_threshold: 0.1
      max_age_days: 30
