version: "3.8"

# MLflow tracking server with PostgreSQL metadata store and S3 artifact store.
# Deploy this on an EC2 instance (t3.small or larger) in the same VPC as ZenML.
#
# Required environment variables (set in .env file or shell):
#   POSTGRES_PASSWORD        — PostgreSQL root password
#   MLFLOW_POSTGRES_PASSWORD — MLflow DB user password
#   AWS_ACCESS_KEY_ID        — AWS credentials for S3 artifact access
#   AWS_SECRET_ACCESS_KEY
#   AWS_DEFAULT_REGION

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: "${MLFLOW_POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
    command: >
      mlflow server
        --backend-store-uri postgresql://mlflow:${MLFLOW_POSTGRES_PASSWORD}@postgres:5432/mlflow
        --default-artifact-root s3://aips-zenml-artifacts/mlflow/
        --host 0.0.0.0
        --port 5000
        --serve-artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy with basic auth (replace with SSL in production)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - mlflow
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro

volumes:
  postgres_data:
