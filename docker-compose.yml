services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      S3_BUCKET: ${ZENML_ARTIFACT_BUCKET:-},${ZENML_CHECKPOINT_BUCKET:-},${ZENML_DATA_BUCKET:-},${ZENML_PREDICTIONS_BUCKET:-}
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_VOLUME_PORT:-8080}:8080"
      - "${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs_data:/data

  ops-db:
    image: mysql:8.0
    container_name: ops-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OPS_DB_ROOT_PASSWORD:-opsroot}
      MYSQL_USER: ${OPS_DB_USER:-ops}
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD:-ops}
      ZENML_DB_NAME: ${ZENML_DB_NAME:-zenml}
      OPTUNA_DB_NAME: ${OPTUNA_DB_NAME:-optuna}
    volumes:
      - ops_db_data:/var/lib/mysql
      - ./docker/ops-db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - 3306:3306
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${OPS_DB_USER:-ops}",
          "-p${OPS_DB_PASSWORD:-ops}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  zenml:
    build:
      context: .
      dockerfile: docker/zenml/Dockerfile
    container_name: zenml-server
    restart: unless-stopped
    ports:
      - "${ZENML_SERVER_PORT:-8237}:8080"
    environment:
      ZENML_SERVER_AUTO_ACTIVATE: ${ZENML_SERVER_AUTO_ACTIVATE:-1}
      ZENML_DEFAULT_USER_NAME: ${ZENML_DEFAULT_USER_NAME:-default}
      ZENML_DEFAULT_USER_PASSWORD: ${ZENML_DEFAULT_USER_PASSWORD:-zenml}
      ZENML_SERVER_JWT_SECRET_KEY: ${ZENML_SERVER_JWT_SECRET_KEY:-change-this-jwt-secret}
      ZENML_STORE_URL: mysql://${OPS_DB_USER:-ops}:${OPS_DB_PASSWORD:-ops}@host.docker.internal/${ZENML_DB_NAME:-zenml}
    volumes:
      - zenml_store:/zenml/.zenconfig/local_stores
    links:
      - ops-db
    depends_on:
      ops-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  registry:
    image: registry:2
    container_name: local-registry
    restart: unless-stopped
    ports:
      - "${LOCAL_REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry_data:/var/lib/registry

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    volumes:
      - hive_metastore_data_v3:/opt/hive/data

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: zenml-local-spark:4.0.1
    container_name: spark-master
    restart: unless-stopped
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"
    volumes:
      - ./docker/spark/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./docker/spark/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/spark/logback.xml:/opt/spark/conf/logback.xml:ro
    depends_on:
      - hive-metastore

  spark-worker:
    image: zenml-local-spark:4.0.1
    container_name: spark-worker
    restart: unless-stopped
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${SPARK_WORKER_UI_PORT:-8082}:8081"
    volumes:
      - ./docker/spark/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./docker/spark/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/spark/logback.xml:/opt/spark/conf/logback.xml:ro
    depends_on:
      - spark-master

volumes:
  seaweedfs_data:
  zenml_store:
  ops_db_data:
  registry_data:
  hive_metastore_data_v3:

networks:
  default:
    name: ${LOCAL_DOCKER_NETWORK:-zenml-local}
