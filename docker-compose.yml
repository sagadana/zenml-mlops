services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}
      S3_BUCKET: ${ZENML_ARTIFACT_BUCKET:-aips-recs-zenml-artifacts},${ZENML_CHECKPOINT_BUCKET:-aips-recs-zenml-checkpoints},${ZENML_DATA_BUCKET:-aips-recs-zenml-data},${ZENML_PREDICTIONS_BUCKET:-aips-recs-zenml-predictions}
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweedfs_data:/data

  ops-db:
    image: mysql:8.0
    container_name: ops-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OPS_DB_ROOT_PASSWORD:-opsroot}
      MYSQL_USER: ${OPS_DB_USER:-ops}
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD:-ops}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      ZENML_DB_NAME: ${ZENML_DB_NAME:-zenml}
      OPTUNA_DB_NAME: ${OPTUNA_DB_NAME:-optuna}
    volumes:
      - ops_db_data:/var/lib/mysql
      - ./docker/ops-db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - 3306:3306
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${OPS_DB_USER:-ops}",
          "-p${OPS_DB_PASSWORD:-ops}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  zenml:
    build:
      context: .
      dockerfile: docker/zenml/Dockerfile
    container_name: zenml-server
    restart: unless-stopped
    ports:
      - "${ZENML_SERVER_PORT:-8237}:8080"
    environment:
      ZENML_SERVER_AUTO_ACTIVATE: ${ZENML_SERVER_AUTO_ACTIVATE:-1}
      ZENML_DEFAULT_USER_NAME: ${ZENML_DEFAULT_USER_NAME:-default}
      ZENML_DEFAULT_USER_PASSWORD: ${ZENML_DEFAULT_USER_PASSWORD:-zenml}
      ZENML_SERVER_JWT_SECRET_KEY: ${ZENML_SERVER_JWT_SECRET_KEY:-change-this-jwt-secret}
      ZENML_STORE_URL: mysql://${OPS_DB_USER:-ops}:${OPS_DB_PASSWORD:-ops}@host.docker.internal/${ZENML_DB_NAME:-zenml}
    volumes:
      - zenml_store:/zenml/.zenconfig/local_stores
    links:
      - ops-db
    depends_on:
      ops-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: mysql+pymysql://${OPS_DB_USER:-ops}:${OPS_DB_PASSWORD:-ops}@host.docker.internal/${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://${ZENML_ARTIFACT_BUCKET:-aips-recs-zenml-artifacts}/mlflow}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://seaweedfs:8333}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${SEAWEEDFS_ACCESS_KEY_ID:-admin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${SEAWEEDFS_SECRET_ACCESS_KEY:-secret}}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${MLFLOW_TRACKING_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    links:
      - ops-db
      - seaweedfs
    depends_on:
      ops-db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  seaweedfs_data:
  zenml_store:
  ops_db_data:
  mlflow_artifacts:
