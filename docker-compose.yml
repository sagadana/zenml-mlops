services:
  ops-db:
    image: mysql:8.0
    container_name: ops-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OPS_DB_ROOT_PASSWORD:-opsroot}
      MYSQL_USER: ${OPS_DB_USER:-ops}
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD:-ops}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      ZENML_DB_NAME: ${ZENML_DB_NAME:-zenml}
    volumes:
      - ops_db_data:/var/lib/mysql
      - ./docker/ops-db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - 3306:3306
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${OPS_DB_USER:-ops}",
          "-p${OPS_DB_PASSWORD:-ops}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  zenml:
    build:
      context: .
      dockerfile: docker/zenml/Dockerfile
    container_name: zenml-server
    restart: unless-stopped
    ports:
      - "${ZENML_SERVER_PORT:-8237}:8080"
    environment:
      ZENML_SERVER_AUTO_ACTIVATE: ${ZENML_SERVER_AUTO_ACTIVATE:-1}
      ZENML_DEFAULT_USER_NAME: ${ZENML_DEFAULT_USER_NAME:-default}
      ZENML_DEFAULT_USER_PASSWORD: ${ZENML_DEFAULT_USER_PASSWORD:-zenml}
      ZENML_STORE_URL: mysql+pymysql://${OPS_DB_USER:-ops}:${OPS_DB_PASSWORD:-ops}@host.docker.internal/${ZENML_DB_NAME:-zenml}
    volumes:
      - zenml_store:/zenml/.zenconfig/local_stores
    links:
      - ops-db
    depends_on:
      ops-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: mysql+pymysql://${OPS_DB_USER:-ops}:${OPS_DB_PASSWORD:-ops}@host.docker.internal/${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: ${MLFLOW_DEFAULT_ARTIFACT_ROOT:-/mlflow/artifacts}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${MLFLOW_TRACKING_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    links:
      - ops-db
    depends_on:
      ops-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dask-scheduler:
    build:
      context: .
      dockerfile: docker/dask/Dockerfile
    container_name: dask-scheduler
    restart: unless-stopped
    command: ["/opt/dask/start-scheduler.sh"]
    ports:
      - "${DASK_SCHEDULER_PORT:-8786}:8786"
      - "${DASK_DASHBOARD_PORT:-8787}:8787"

  dask-worker:
    build:
      context: .
      dockerfile: docker/dask/Dockerfile
    restart: unless-stopped
    depends_on:
      - dask-scheduler
    command: ["/opt/dask/start-worker.sh"]
    environment:
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:${DASK_SCHEDULER_PORT:-8786}

volumes:
  zenml_store:
  ops_db_data:
  mlflow_artifacts:
