services:
  zenml:
    build:
      context: .
      dockerfile: docker/zenml/Dockerfile
    container_name: zenml-server
    restart: unless-stopped
    ports:
      - "8237:8080"
    volumes:
      - zenml_store:/zenml/.zenconfig/local_stores

  mlflow-db:
    image: postgres:16-alpine
    container_name: mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  evidently:
    build:
      context: .
      dockerfile: docker/evidently/Dockerfile
    container_name: evidently-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - evidently_workspace:/app/workspace

  dask-scheduler:
    build:
      context: .
      dockerfile: docker/dask/Dockerfile
    container_name: dask-scheduler
    restart: unless-stopped
    command: ["/opt/dask/start-scheduler.sh"]
    ports:
      - "8786:8786"
      - "8787:8787"

  dask-worker:
    build:
      context: .
      dockerfile: docker/dask/Dockerfile
    restart: unless-stopped
    depends_on:
      - dask-scheduler
    command: ["/opt/dask/start-worker.sh"]
    environment:
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786

volumes:
  zenml_store:
  mlflow_db_data:
  mlflow_artifacts:
  evidently_workspace:
